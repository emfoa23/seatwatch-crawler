name: crawl-megabox

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated externalEventId (empty = all active watches)'
        required: false
        default: ''

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          VALKEY_KEY_PREFIX: ${{ secrets.VALKEY_KEY_PREFIX }}
          CRAWLER_USER_AGENT_POOL: ${{ secrets.CRAWLER_USER_AGENT_POOL }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python main.py --site megabox --targets '${{ inputs.targets }}'
